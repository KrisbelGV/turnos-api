spring.application.name=turnos-api
server.port=8080

# Pais para consultar feriados (codigo ISO de 2 letras: AR, BR, MX, CO, CL...)
turnos.pais=AR

# --- Cliente HTTP declarativo: grupo "feriados" (API publica Nager.Date) ---
spring.http.serviceclient.feriados.base-url=https://date.nager.at
spring.http.serviceclient.feriados.connect-timeout=2s
spring.http.serviceclient.feriados.read-timeout=3s

# --- Errores con ProblemDetail (RFC 9457) ---
spring.mvc.problemdetails.enabled=true

# --- Versionado nativo de APIs (Spring Framework 7) ---
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Base de datos: H2 guardada en un archivo (carpeta ./data) ---
# NUEVO (P1-LC3): antes era jdbc:h2:mem:turnos (se borraba al reiniciar).
# Con "file", los datos sobreviven a los reinicios.
spring.datasource.url=jdbc:h2:file:./data/turnos
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# NUEVO (P1-LC3): con una base en archivo, Spring ya no corre schema.sql/data.sql solo.
# "always" le dice que los ejecute en cada arranque (por eso están escritos para no duplicar datos).
spring.sql.init.mode=always

# --- NUEVO (P1-LC3): pool de conexiones HikariCP ---
spring.datasource.hikari.pool-name=TurnosPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
# Muestra en el log cuántas conexiones están en uso, libres o en espera
logging.level.com.zaxxer.hikari=DEBUG

# --- Virtual Threads: cada request en un hilo virtual ---
spring.threads.virtual.enabled=true
